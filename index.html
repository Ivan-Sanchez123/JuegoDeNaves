<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" 
    content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
    <title>Juego de Naves ☺</title>
    <style>
        * { padding: 0; margin: 0; }
        canvas {
            background: #eee;
            display: block;
            margin: 0 auto;
        }
        .customButton {
            border:9.1px double #0F00FF;
            border-radius:46.3px;
            padding:20px;
            margin:29.7px;
            background-color:#F9F9F9;
            color:#0F00FF;
            font-weight:300;
            opacity:1;
            transition:0.5s;
        }
        .customButton:hover {
            cursor:pointer; 
            background-color:#F9F9F8;
            opacity:0.7;
            transition:0.5s;
            color:#0F00FE;
        }
    </style>
</head>
<body>
    <div class="html_button btn-center">
        <button type="button" onclick="iniciarJuego()" class="btn customButton x-large icon-before play">Play</button>
    </div>

<canvas id="canvas" width="480" height="320"></canvas>
<script src="src/Globales.js"></script>
<script src="src/GestorAudio.js"></script>
<script src="src/Graficos/Animacion.js"></script>
<script src="src/Modelos/Modelo.js"></script>
<script src="src/Modelos/Texto.js"></script>
<script src="src/Modelos/disparo_jugador.js"></script>
<script src="src/Modelos/Fondo.js"></script>
<script src="src/Modelos/Jugador.js"></script>
<script src="src/Layers/Layer.js"></script>
<script src="src/Layers/GameLayer.js"></script>
<script src="src/Res.js"></script>
<script src="src/EventosTeclado.js"></script>
<script src="src/Modelos/Enemigo.js"></script>
<script src="main.js"></script>

</body>
</html>
